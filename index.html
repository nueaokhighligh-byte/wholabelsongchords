    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --primary: #4b5563;
            --primary-hover: #374151;
            --chord-color: #ea580c;
            --text-main: #4b5563;
            --text-muted: #6b7280;
            --accent-red: #6b7280;
        }ป

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        #chordApp {
            display: none;
            width: 100%;
        }

        .back-home-button {
            display: inline-flex;
            align-items: center;
            margin: 0 0 10px 2px;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .back-home-button img {
            display: block;
            width: 200px;
            height: 200px;
            aspect-ratio: 1;
            object-fit: contain;
        }

        .back-home-button:hover {
            transform: translateX(-2px);
            opacity: 0.78;
        }

        #pdfLink {
            display: none;
        }

        .landing-page {
            width: min(100%, 900px);
            min-height: calc(100vh - 24px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-card {
            width: 100%;
            padding: clamp(28px, 7vw, 72px) 24px;
            text-align: center;
            border: 1px solid var(--card-border);
            border-radius: 28px;
            background: linear-gradient(145deg, #ffffff 0%, #f3f4f6 100%);
            box-shadow: 0 16px 45px rgba(17, 24, 39, 0.1);
        }

        .landing-logo {
            width: min(180px, 42vw);
            aspect-ratio: 1;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        .landing-card h1 {
            color: var(--text-main);
            font-size: clamp(1.7rem, 5vw, 2.8rem);
            font-weight: 400;
        }

        .landing-card p {
            max-width: 580px;
            margin: 12px auto 26px;
            color: var(--text-muted);
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            line-height: 1.8;
        }

        .enter-chords-button {
            border: 1px solid #9ca3af;
            border-radius: 999px;
            padding: 11px 24px;
            background: #4b5563;
            color: #ffffff;
            font: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .enter-chords-button:hover {
            background: #374151;
            transform: translateY(-2px);
        }

        .landing-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .landing-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        body.dark-mode .landing-card {
            background: linear-gradient(145deg, #1b1c22 0%, #15161b 100%);
            border-color: #30323a;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
        }

        body.dark-mode .landing-card h1 {
            color: #d1d5db;
        }

        body.dark-mode .back-home-button {
            background: transparent;
        }

        body.dark-mode .back-home-button img {
            filter: invert(1);
        }

        body.dark-mode .enter-chords-button {
            background: #30323a;
            border-color: #4b5563;
        }

        body.dark-mode .enter-chords-button:hover {
            background: #3b3f48;
        }

        /* Header Bar */
        header {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.08);
        }

        .site-logo {
            display: block;
            width: 120px;
            height: auto;
            margin: 0 auto;
        }

        body,
        body * {
            font-weight: 400;
        }

        .card-title,
        .sidebar-title,
        .chord-summary-title,
        .section-tag,
        .label-text {
            font-weight: 400;
        }

        .chord,
        .chord-summary-item {
            font-weight: 500;
        }

        .channel-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .channel-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #d1d5db;
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background: #e5e7eb;
            color: #374151;
            transform: translateY(-1px);
        }

        .channel-btn.youtube-btn {
            background: #ff0000;
            color: #ffffff;
            border-color: #cc0000;
            font-weight: 600;
        }

        .channel-btn.youtube-btn:hover {
            background: #cc0000;
            color: #ffffff;
        }

        .channel-btn.twitter-btn {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
            font-weight: 600;
        }

        .channel-btn.twitter-btn:hover {
            background: #1f2937;
            color: #ffffff;
        }

        /* Sticky Control Panel */
        .control-panel {
            position: sticky;
            top: 12px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            isolation: isolate;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .label-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        select:focus {
            border-color: var(--primary);
        }

        /* Key Transpose Buttons */
        .btn-key {
            background: #f3f4f6;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.9rem;
        }

        .key-step-button {
            min-width: 42px;
            font-size: 1.25rem;
            line-height: 1;
        }

        .btn-key:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-key:active {
            transform: scale(0.95);
        }

        .key-badge {
            background: #f3f4f6;
            color: var(--chord-color);
            border: 1px solid #d1d5db;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 75px;
            text-align: center;
            white-space: nowrap;
        }

        /* View Mode Toggle Buttons */
        .view-toggle {
            display: flex;
            background: var(--bg-dark);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 16px;
        }

        .sidebar {
            align-self: start;
            position: sticky;
            top: 10px;
        }

        .sidebar-title {
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .sidebar select {
            width: 100%;
            margin-top: 6px;
            font-size: 0.92rem;
            padding: 10px 12px;
        }

        .upcoming-song {
            padding: 8px 10px;
            margin-top: 7px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: #f9fafb;
        }

        .upcoming-song strong {
            display: block;
            color: var(--text-main);
            font-size: 0.82rem;
        }

        .upcoming-song span {
            display: block;
            margin-top: 2px;
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .content-column {
            display: grid;
            gap: 16px;
        }

        @media (max-width: 899px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .song-details {
            display: grid;
            gap: 4px;
            align-self: start;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
        }

        .song-info {
            margin-bottom: 16px;
            gap: 10px;
        }

        .song-info .card-title {
            margin: 0 0 4px;
        }

        .song-details strong {
            color: var(--primary);
        }

        .song-details a {
            color: var(--primary);
        }

        .song-details .highlight-name {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            background: #f97316;
            color: #ffffff;
            font-weight: 700;
        }

        .chord-content-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 240px;
            gap: 16px;
            align-items: start;
        }

        .chord-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid var(--card-border);
            border-radius: 10px;
        }

        .chord-summary-title {
            color: var(--text-main);
            font-weight: 600;
            margin-right: 4px;
        }

        .chord-summary-item {
            display: inline-block;
            padding: 3px 8px;
            background: #fff7ed;
            border: 1px solid a#fdba74;
            border-radius: 6px;
            color: var(--chord-color);
            font-family: monospace;
            font-weight: 700;
        }

        /* Chord Content Area */
        .chord-box {
            line-height: 2;
            font-size: 1.05rem;
            white-space: pre-wrap;
            font-family: 'Sarabun', sans-serif;
        }

        .section-tag {
            display: inline-block;
            background: #f3f4f6;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            margin: 12px 0 6px 0;
            font-family: 'Kanit', sans-serif;
        }

        .chord {
            color: var(--chord-color);
            font-weight: 700;
            font-family: monospace;
            font-size: 1.15rem;
            background: #fff7ed;
            padding: 1px 5px;
            border-radius: 4px;
            margin: 0 2px;
        }

        /* Image View */
        .img-container {
            text-align: center;
        }

        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 12px rgba(17, 24, 39, 0.12);
        }

        /* YouTube Container */
        .video-wrapper {
            position: relative;
            width: min(100%, 360px);
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #111827;
            border: 1px solid var(--card-border);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .playlist-info {
            margin-top: 14px;
            padding: 12px;
            background: var(--bg-dark);
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .playlist-info a {
            color: var(--primary);
            text-decoration: none;
        }

        .playlist-info a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        body.dark-mode {
            --bg-dark: #0f1014;
            --card-bg: #1b1c22;
            --card-border: #30323a;
            --primary: #e5e7eb;
            --primary-hover: #ffffff;
            --text-main: #d1d5db;
            --text-muted: #9ca3af;
        }

        body.dark-mode header,
        body.dark-mode .card,
        body.dark-mode .control-panel {
            background: #1b1c22;
            color: #d1d5db;
            border-color: #30323a;
        }

        body.dark-mode header {
            background: linear-gradient(135deg, #0f1014 0%, #1b1c22 100%);
            position: relative;
            overflow: hidden;
        }

        body.dark-mode .site-logo {
            filter: invert(1);
        }

        body.dark-mode header::after {
            content: "";
            position: absolute;
            inset: 9px;
            border: 1px solid rgba(156, 163, 175, 0.24);
            border-radius: 20px;
            pointer-events: none;
        }

        body.dark-mode .channel-btn,
        body.dark-mode .btn-key,
        body.dark-mode select,
        body.dark-mode .chord-summary,
        body.dark-mode .upcoming-song,
        body.dark-mode .playlist-info {
            background: #24262d;
            color: #d1d5db;
            border-color: #3a3d46;
        }

        body.dark-mode .btn-key[onclick="resetKey()"] {
            background: #24262d !important;
            color: #ffffff !important;
            border-color: #6b7280 !important;
        }

        body.dark-mode .channel-btn:hover,
        body.dark-mode .btn-key:hover {
            background: #343740;
            color: #ffffff;
        }

        body.dark-mode .channel-btn.youtube-btn,
        body.dark-mode .channel-btn.youtube-btn:hover {
            background: #ff0000;
            color: #ffffff;
            border-color: #cc0000;
        }

        body.dark-mode .channel-btn.twitter-btn,
        body.dark-mode .channel-btn.twitter-btn:hover {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        body.dark-mode .label-text,
        body.dark-mode .upcoming-song span,
        body.dark-mode .playlist-info {
            color: #d1d5db;
        }

        body.dark-mode .song-details {
            background: #24262d;
            color: #f3f4f6;
            border-color: #3a3d46;
        }

        body.dark-mode .song-details strong,
        body.dark-mode .song-details a {
            color: #ffffff;
        }

        body.dark-mode .song-details .highlight-name {
            background: #fb923c;
            color: #111217;
        }

        body.dark-mode .section-tag {
            background: #30323a;
            color: #d1d5db;
        }

        body.dark-mode #themeToggle,
        body.dark-mode .btn-key[onclick="resetKey()"] {
            background: #24262d !important;
            color: #d1d5db !important;
            border-color: #4b4f59;
        }

        /* Keep chord highlighting orange in both themes. */
        body.dark-mode .chord,
        body.dark-mode .chord-summary-item {
            color: #fb923c;
            background: rgba(234, 88, 12, 0.3);
            border-color: rgba(253, 186, 116, 0.3);
            text-shadow: 0 0 1px rgba(0, 0, 0, 0.35);
        }

        body.dark-mode .video-wrapper {
            background: #0f1014;
            border-color: #30323a;
        }

        body.dark-mode,
        body.dark-mode body *,
        body.dark-mode .card-title,
        body.dark-mode .sidebar-title,
        body.dark-mode .chord-summary-title,
        body.dark-mode .section-tag,
        body.dark-mode .label-text {
            font-weight: 300;
        }

        body.dark-mode .song-details strong,
        body.dark-mode .song-details a,
        body.dark-mode .key-badge {
            font-weight: 400;
        }

        body.dark-mode .chord,
        body.dark-mode .chord-summary-item {
            font-weight: 400;
        }

        @media (max-width: 899px) {
            .control-panel { top: 8px; padding: 10px; gap: 8px; }
            .key-badge { min-width: 60px; font-size: 0.85rem; }
            .btn-key { padding: 5px 8px; font-size: 0.8rem; }
            .chord-box { font-size: 0.95rem; }
            .chord { font-size: 1.05rem; }
            .chord-viewer-card .chord-content-layout {
                grid-template-columns: 1fr;
            }

            .chord-viewer-card .song-details {
                margin-bottom: 16px;
            }

            .chord-viewer-card .chord-content-layout { grid-template-columns: 1fr; }
        }

        /* Light theme: thin, curved editorial artwork style. */
        body:not(.dark-mode) {
            --bg-dark: #f1f1ec;
            --card-bg: #f8f8f4;
            --card-border: #c9c9c2;
            --primary: #303236;
            --primary-hover: #1f2023;
            --text-main: #303236;
            --text-muted: #5f625f;
            background:
                radial-gradient(circle at 92% 8%, rgba(255, 255, 255, 0.8), transparent 28%),
                #f1f1ec;
            color: #303236;
            font-weight: 300;
        }

        body:not(.dark-mode) body,
        body:not(.dark-mode) body *,
        body:not(.dark-mode) .card-title,
        body:not(.dark-mode) .sidebar-title,
        body:not(.dark-mode) .chord-summary-title,
        body:not(.dark-mode) .section-tag,
        body:not(.dark-mode) .label-text {
            font-weight: 300;
        }

        body:not(.dark-mode) header,
        body:not(.dark-mode) .card {
            position: relative;
            background: rgba(248, 248, 244, 0.9);
            border: 1px solid #c9c9c2;
            border-radius: 26px;
            box-shadow: 0 2px 0 rgba(48, 50, 54, 0.04);
        }

        body:not(.dark-mode) header::after,
        body:not(.dark-mode) .card::after {
            content: "";
            position: absolute;
            inset: 9px;
            border: 1px solid rgba(95, 98, 95, 0.18);
            border-radius: 20px;
            pointer-events: none;
        }

        body:not(.dark-mode) header {
            background: #ecece7;
            padding: 24px;
            overflow: hidden;
        }

        body:not(.dark-mode) .site-logo,
        body.dark-mode .site-logo {
            aspect-ratio: 1 / 1;
            object-fit: contain;
        }

        body:not(.dark-mode) .control-panel {
            position: sticky;
            top: 12px;
            background: rgba(248, 248, 244, 0.94);
            border-radius: 18px;
            box-shadow: 0 2px 0 rgba(48, 50, 54, 0.04);
        }

        body:not(.dark-mode) .channel-btn,
        body:not(.dark-mode) .btn-key,
        body:not(.dark-mode) select,
        body:not(.dark-mode) .upcoming-song,
        body:not(.dark-mode) .song-details,
        body:not(.dark-mode) .chord-summary {
            background: transparent;
            color: #303236;
            border: 1px solid #aeb0aa;
            border-radius: 14px;
            font-weight: 300;
        }

        body:not(.dark-mode) .channel-btn {
            border-radius: 999px;
        }

        body:not(.dark-mode) .channel-btn.youtube-btn {
            background: #ff0000;
            color: #ffffff;
            border-color: #cc0000;
        }

        body:not(.dark-mode) .channel-btn.twitter-btn {
            background: #222326;
            color: #ffffff;
            border-color: #222326;
        }

        body:not(.dark-mode) .btn-key:hover {
            background: #303236;

    let currentSongKey = 'wan_fah_mon';
    let semitoneShift = 0;
    let chordVersion = 'easy';

    const hardChordMap = {
        '[Em]': '[Em7]', '[C]': '[Cmaj7]', '[G]': '[Gsus2]', '[Bm]': '[Bm7]',
        '[D]': '[Dsus4/F#]', '[Am]': '[Am7]', '[Cm]': '[Cm6]', '[Dm]': '[Dm7]', '[G7]': '[G7]',
        '[E]': '[E11]', '[F]': '[F6]'
    };

    // Helper to normalize note name
    function normalizeNote(note) {
        const flatsMap = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
        return flatsMap[note] || note;
    }

    // Transpose a single note
    function transposeNote(note, shift) {
        const cleanNote = normalizeNote(note);
        const index = chromaticScale.indexOf(cleanNote);
        if (index === -1) return note;

        let newIndex = (index + shift) % 12;
        if (newIndex < 0) newIndex += 12;
        return chromaticScale[newIndex];
    }

    // Transpose full chord (handles root, extension, slash bass)
    function transposeChord(chord, shift) {
        return chord.replace(/([A-G][b#]?)([^/]*)(?:\/([A-G][b#]?))?/g, (match, root, ext, bass) => {
            const newRoot = transposeNote(root, shift);
            const newBass = bass ? '/' + transposeNote(bass, shift) : '';
            return newRoot + (ext || '') + newBass;
        });
    }

    // Calculate current Key Name
    function getCurrentKeyName() {
        const origKey = songs[currentSongKey].originalKey;
        return transposeNote(origKey, semitoneShift);
    }

    // Render song content
    function render() {
        const song = songs[currentSongKey];
        const versionControl = document.getElementById('chordVersionControl');
        const versionSelect = document.getElementById('chordVersion');
        const isTwoVersionSong = Boolean(song.easyPdfFile);
        versionControl.style.display = isTwoVersionSong ? 'block' : 'none';
        versionSelect.value = isTwoVersionSong ? chordVersion : 'hard';
        const rawChords = isTwoVersionSong && chordVersion === 'hard'
            ? Object.entries(hardChordMap).reduce((text, [simple, complex]) => text.split(simple).join(complex), song.rawChords)
            : song.rawChords;
        document.getElementById('songTitle').innerText = song.title;
        document.getElementById('songDetails').innerHTML =
            `<div><strong>vocal:</strong> ${song.vocal}</div>` +
            `<div><strong>เรื่องราวเพลง:</strong> ${song.occasion}</div>`;
        document.getElementById('youtubeIframe').src = song.youtubeId
            ? `https://www.youtube.com/embed/${song.youtubeId}`
            : '';
        document.getElementById('pdfLink').href = isTwoVersionSong && chordVersion === 'easy'
            ? song.easyPdfFile
            : song.pdfFile;

        // Key badge text
        const curKey = getCurrentKeyName();
        const shiftSign = semitoneShift > 0 ? `+${semitoneShift}` : semitoneShift;
        document.getElementById('keyDisplay').innerText = `Key: ${curKey} | เปลี่ยนคีย์: ${shiftSign}`;

        const sectionLabels = /^(Intro|inst|Instrumental|Verse(?: \d+)?|Pre-Chorus(?: \d+)?|Chorus(?: \d+)?|Outro|Solo|Bridge)$/i;
        const detectedChords = [...new Set(
            [...rawChords.matchAll(/\[([A-G][b#]?[^\]]*)\]/g)]
                .map(([, chord]) => chord)
                .filter(chord => !sectionLabels.test(chord))
                .map(chord => transposeChord(chord, semitoneShift))
        )];
        const chords = [...new Set(
            detectedChords.concat(
                isTwoVersionSong && chordVersion === 'hard'
                    ? (song.originalChords || []).map(chord => transposeChord(chord, semitoneShift))
                    : []
            )
        )];
        document.getElementById('chordSummary').innerHTML =
            `<span class="chord-summary-title">คอร์ดที่ใช้:</span>${chords
                .map(chord => `<span class="chord-summary-item">${chord}</span>`)
                .join('')}`;

        // Parse chords and tags
        let text = rawChords;

        text = text.replace(/\[(inst|Intro|Instrumental|Verse \d+|Verse|Pre-Chorus(?: \d+)?|Chorus(?: \d+)?|Outro|Solo|Bridge)\]/gi, (m, tag) => {
            return `<div class="section-tag">${tag}</div>`;
        });

        text = text.replace(/\[([A-G][b#]?[^\]]*)\]/g, (match, chord) => {
            const newChord = transposeChord(chord, semitoneShift);
            return `<span class="chord">${newChord}</span>`;
        });

        document.getElementById('chordDisplay').innerHTML = text;
    }

    function transpose(amount) {
        semitoneShift = Math.max(-7, Math.min(7, semitoneShift + amount));
        render();
    }

    function resetKey() {
        semitoneShift = 0;
        render();
    }

    function switchSong() {
        currentSongKey = document.getElementById('songSelect').value;
        semitoneShift = 0;
        chordVersion = 'easy';
        render();
    }

    function switchChordVersion() {
        chordVersion = document.getElementById('chordVersion').value;
        semitoneShift = 0;
        render();
    }
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.innerText = isDark ? '☀' : '☾';
        themeToggle.setAttribute('aria-label', isDark ? 'เปิดโหมดสว่าง' : 'เปิดโหมดมืด');
        themeToggle.title = isDark ? 'เปิดโหมดสว่าง' : 'เปิดโหมดมืด';
    }

    function openChordApp() {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('chordApp').style.display = 'block';
        document.getElementById('pdfLink').style.display = 'inline-flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToHome() {
        document.getElementById('chordApp').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
        document.getElementById('pdfLink').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setMode(mode) {
        const textV = document.getElementById('textView');
        const imgV = document.getElementById('imgView');
        const btnT = document.getElementById('btnModeText');
        const btnI = document.getElementById('btnModeImg');

        if (mode === 'text') {
            textV.classList.remove('hidden');
            imgV.classList.add('hidden');
            btnT.classList.add('active');
            btnI.classList.remove('active');
        } else {
            textV.classList.add('hidden');
            imgV.classList.remove('hidden');
            btnT.classList.remove('active');
            btnI.classList.add('active');
        }
    }

    // Initial Load
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').innerText = '☀';
        document.getElementById('themeToggle').setAttribute('aria-label', 'เปิดโหมดสว่าง');
        document.getElementById('themeToggle').title = 'เปิดโหมดสว่าง';
    }
    render();
</script>
